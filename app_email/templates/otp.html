<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کد تایید</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family:Tahoma, Arial, sans-serif;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding:32px 0;">
    <tr>
      <td align="center">

        <table role="presentation" width="480" cellpadding="0" cellspacing="0"
               style="background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06);">

          <!-- هدر -->
          <tr>
            <td style="background-color:#4f46e5; padding:24px 32px; text-align:center;">
              <span style="color:#ffffff; font-size:20px; font-weight:bold;">کد تایید ورود</span>
            </td>
          </tr>

          <!-- بدنه -->
          <tr>
            <td style="padding:32px; text-align:center;">
              <p style="margin:0 0 16px; font-size:15px; color:#333333; line-height:1.8;">
                سلام،<br />
                برای تکمیل فرآیند ورود یا ثبت‌نام، کد زیر را در برنامه وارد کنید:
              </p>

              <!-- کادر کد OTP -->
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px auto;">
                <tr>
                  <td style="background-color:#f0f0fb; border:1px solid #dcdcf5; border-radius:8px; padding:16px 32px;">
                    <span style="font-size:32px; font-weight:bold; letter-spacing:8px; color:#4f46e5; direction:ltr; display:inline-block;">
                      {{ otp_code }}
                    </span>
                  </td>
                </tr>
              </table>

              <p style="margin:16px 0 0; font-size:13px; color:#888888; line-height:1.8;">
                این کد تا <strong>۲ دقیقه</strong> دیگر معتبر است.<br />
                اگر این درخواست از سمت شما نبوده، این ایمیل را نادیده بگیرید.
              </p>
            </td>
          </tr>

          <!-- خط جداکننده -->
          <tr>
            <td style="padding:0 32px;">
              <hr style="border:none; border-top:1px solid #eeeeee; margin:0;" />
            </td>
          </tr>

          <!-- فوتر -->
          <tr>
            <td style="padding:20px 32px; text-align:center;">
              <p style="margin:0; font-size:12px; color:#aaaaaa;">
                این ایمیل به‌صورت خودکار ارسال شده است، لطفاً به آن پاسخ ندهید.
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>

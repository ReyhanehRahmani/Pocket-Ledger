<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دفترچه — Pocket Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171a;
    --surface:#1b1f23;
    --surface-2:#20242a;
    --border:#2a2f35;
    --text:#e9e7e2;
    --text-muted:#8f969d;
    --income:#8fae87;
    --income-dim:#556a51;
    --expense:#c07687;
    --expense-dim:#6e4650;
    --ring:#dcd8ce;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Vazirmatn', sans-serif;
    font-feature-settings:'tnum' 1;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input, select, textarea{font-family:inherit;}
  select{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:9px 10px; font-size:13.5px; outline:none;
  }
  select:focus{border-color:var(--ring);}

  /* ===== utility ===== */
  .muted{color:var(--text-muted); font-size:13px;}
  .hidden{display:none !important;}
  .stack{display:flex; flex-direction:column; gap:12px;}
  .row{display:flex; gap:10px; align-items:center;}
  .spread{display:flex; justify-content:space-between; align-items:center;}

  /* ===== field ===== */
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:13px; color:var(--text-muted);}
  .field input, .field textarea{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-size:14.5px;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus, .field textarea:focus{ border-color:var(--ring); }
  .field textarea{resize:vertical; min-height:60px;}
  .hint{font-size:12px; color:var(--text-muted);}

  /* ===== jalali date picker ===== */
  .jdate-picker{display:grid; grid-template-columns:1fr 1.35fr 1fr; gap:8px;}
  .jdate-picker select{width:100%;}

  /* ===== buttons ===== */
  .btn{
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    padding:10px 16px;
    border-radius:8px;
    font-size:14px;
    font-weight:500;
    transition:border-color .15s, opacity .15s;
  }
  .btn:hover{border-color:var(--ring);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-primary{
    background:var(--ring);
    color:#15181b;
    border-color:var(--ring);
    font-weight:600;
  }
  .btn-primary:hover{opacity:.9; border-color:var(--ring);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--text-muted);}
  .btn-ghost:hover{color:var(--text); border-color:var(--border);}
  .btn-danger{color:var(--expense); border-color:var(--expense-dim); background:transparent;}
  .btn-danger:hover{background:var(--expense-dim); color:var(--text);}
  .btn-excel{display:inline-flex; align-items:center; gap:9px; padding:9px 16px; font-size:13.5px; font-weight:700; letter-spacing:.2px; background:#1D6F42; border-color:#1D6F42; color:#fff; box-shadow:0 2px 10px rgba(29,111,66,.35);}
  .btn-excel:hover{background:#21834f; border-color:#34b26b;}
  .btn-excel .xl-ico{width:20px; height:20px; border-radius:4px; background:#fff; color:#1D6F42; font-weight:800; font-size:13px; line-height:1; display:inline-flex; align-items:center; justify-content:center;}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 10px; font-size:12.5px; border-radius:6px;}
  .btn-xs{padding:4px 9px; font-size:11.5px; border-radius:6px;}
  .spinner{display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-inline-end:8px;}
  .avatar-btn{width:34px; height:34px; padding:0; border-radius:50%; border:1px solid var(--border); background:var(--surface-2); overflow:hidden;}
  .avatar-btn img, .avatar-opt img{width:100%; height:100%; object-fit:cover; display:block;}
  .avatar-picker{position:absolute; top:100%; inset-inline-end:16px; margin-top:6px; display:flex; gap:10px; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; z-index:10;}
  .avatar-opt{width:52px; height:52px; padding:0; border-radius:50%; border:2px solid transparent; background:none; overflow:hidden;}
  .avatar-opt:hover{border-color:var(--text-muted);}
  .avatar-opt.active{border-color:var(--ring);}

  /* ===== header user chip ===== */
  .user-chip{display:flex; align-items:center; gap:9px; padding:3px 4px 3px 14px; border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--text); font-size:13px; font-weight:500; transition:border-color .15s, background .15s;}
  .user-chip:hover, .user-chip.active{border-color:var(--ring); background:var(--surface-2);}
  .chip-avatar{width:30px; height:30px; border-radius:50%; padding:2px; border:1.5px solid var(--ring); background:var(--bg); flex:none;}
  .chip-avatar img{width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;}
  .chip-name{max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .logout-btn{background:transparent; border:1px solid transparent; color:var(--text-muted); font-size:12.5px; padding:6px 10px; border-radius:999px; transition:color .15s, border-color .15s;}
  .logout-btn:hover{color:var(--expense); border-color:var(--expense-dim);}

  /* ===== profile tab ===== */
  .profile-card{position:relative; border:1px solid var(--border); border-radius:16px; overflow:hidden; background:var(--surface); margin-bottom:16px;}
  .profile-banner{height:96px; background:
      radial-gradient(120% 140% at 15% 0%, rgba(143,174,135,.28) 0%, transparent 55%),
      radial-gradient(120% 140% at 85% 10%, rgba(192,118,135,.24) 0%, transparent 55%),
      linear-gradient(180deg, var(--surface-2), var(--surface));}
  .profile-body{display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 20px 22px; margin-top:-48px;}
  .profile-avatar{width:96px; height:96px; border-radius:50%; padding:4px; background:var(--surface); border:2px solid var(--ring); box-shadow:0 0 0 6px rgba(220,216,206,.08), 0 8px 24px rgba(0,0,0,.35);}
  .profile-avatar img{width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;}
  .profile-name{font-size:20px; font-weight:700; margin-top:14px; letter-spacing:.2px;}

  .profile-name{position:relative; display:inline-block;}
  .name-edit{position:absolute; top:50%; inset-inline-end:100%; margin-inline-end:6px; transform:translateY(-50%); background:transparent; border:1px solid transparent; color:var(--text-muted); width:26px; height:26px; border-radius:50%; font-size:14px; line-height:1; transition:color .15s, border-color .15s;}
  .name-edit:hover{color:var(--text); border-color:var(--border);}
  .name-form{display:flex; gap:6px; align-items:center; margin-top:14px; flex-wrap:wrap; justify-content:center;}
  .name-form input{background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 12px; font-size:15px; font-family:inherit; text-align:center; outline:none; width:200px; max-width:100%;}
  .name-form input:focus{border-color:var(--ring);}
  .name-error{color:var(--expense); font-size:12.5px; margin-top:8px;}
  .profile-email{display:inline-flex; align-items:center; gap:6px; margin-top:4px; font-size:13px; color:var(--text-muted); direction:ltr; unicode-bidi:plaintext;}
  .profile-since{display:inline-flex; align-items:center; gap:5px; margin-top:12px; padding:3px 10px; font-size:11.5px; color:var(--text-muted); border:1px solid var(--border); border-radius:999px; background:var(--bg);}
  .profile-stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; background:var(--border); border-top:1px solid var(--border);}
  .profile-stats .cell{background:var(--surface); padding:14px 8px; text-align:center;}
  .profile-stats .num{font-size:17px; font-weight:700;}
  .profile-stats .lbl{font-size:11.5px; color:var(--text-muted);}
  .profile-avatars{border:1px solid var(--border); border-radius:14px; background:var(--surface); padding:16px;}
  .profile-avatars h3{font-size:13.5px; font-weight:600; margin-bottom:12px;}
  .profile-avatars .opts{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .profile-avatars .avatar-opt{width:60px; height:60px; transition:transform .15s, border-color .15s;}
  .profile-avatars .avatar-opt:hover{transform:translateY(-2px);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .chart-wrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap; justify-content:center;}
  .donut{width:180px; height:180px; flex:none;}
  .donut .seg{transition:opacity .15s; cursor:default;}
  .donut .seg:hover{opacity:.75;}
  .donut-total{font-size:11px; fill:var(--text-muted);}
  .donut-value{font-size:13px; font-weight:600; fill:var(--text);}
  .legend{flex:1; min-width:200px; display:flex; flex-direction:column; gap:8px;}
  .legend-row{display:flex; align-items:center; gap:8px; font-size:13px;}
  .legend-dot{width:10px; height:10px; border-radius:3px; flex:none;}
  .legend-name{flex:1; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .legend-pct{color:var(--text-muted); font-size:12px; min-width:34px; text-align:left;}

  /* ===== auth screen ===== */
  .auth-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:100%; max-width:380px; border:1px solid var(--border); background:var(--surface); border-radius:14px; padding:28px 26px; }
  .brand{text-align:center; margin-bottom:22px;}
  .brand .mark{ display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border:1px solid var(--border); border-radius:10px; margin-bottom:10px; font-size:18px; }
  .brand h1{font-size:17px; font-weight:600;}
  .brand p{font-size:12.5px; color:var(--text-muted); margin-top:4px;}

  .tabs{display:flex; border:1px solid var(--border); border-radius:9px; padding:3px; margin-bottom:20px;}
  .tabs button{ flex:1; background:transparent; border:none; border-radius:6px; padding:8px 0; font-size:13.5px; color:var(--text-muted); }
  .tabs button.active{background:var(--surface-2); color:var(--text); font-weight:600;}

  .error-box{ background:rgba(192,118,135,.1); border:1px solid var(--expense-dim); color:var(--expense); font-size:13px; padding:9px 12px; border-radius:8px; }
  .ok-box{ background:rgba(143,174,135,.1); border:1px solid var(--income-dim); color:var(--income); font-size:13px; padding:9px 12px; border-radius:8px; }
  .step-dots{display:flex; gap:6px; justify-content:center; margin-bottom:18px;}
  .step-dots span{width:6px; height:6px; border-radius:50%; background:var(--border);}
  .step-dots span.active{background:var(--ring);}

  /* ===== app shell ===== */
  .topbar{ border-bottom:1px solid var(--border); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--bg); z-index:5; }
  .topbar .brand-inline{display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px;}
  .topbar .mark-sm{ width:26px; height:26px; border:1px solid var(--border); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .main{max-width:640px; width:100%; margin:0 auto; padding:20px; flex:1;}

  /* ===== summary ===== */
  .summary-label{font-size:12.5px; color:var(--text-muted); margin-bottom:8px;}
  .summary{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:20px; background:var(--border); }
  .summary .cell{background:var(--surface); padding:16px 14px;}
  .summary .cell .label{font-size:12px; color:var(--text-muted); margin-bottom:6px;}
  .summary .cell .value{font-size:16px; font-weight:700; letter-spacing:.2px;}
  .summary .income .value{color:var(--income);}
  .summary .expense .value{color:var(--expense);}

  /* ===== tabs nav ===== */
  .nav{display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:18px;}
  .nav button{ background:transparent; border:none; color:var(--text-muted); padding:9px 4px; font-size:13.5px; position:relative; margin-left:14px; }
  .nav button.active{color:var(--text); font-weight:600;}
  .nav button.active::after{ content:''; position:absolute; right:0; left:0; bottom:-1px; height:2px; background:var(--ring); }

  /* ===== day grouping ===== */
  .day-sep{display:flex; align-items:center; gap:10px; margin:20px 0 4px;}
  .day-sep:first-child{margin-top:0;}
  .day-sep .line{flex:1; height:1px; background:var(--border);}
  .day-sep .label{font-size:12px; color:var(--text-muted); white-space:nowrap; font-weight:500;}

  /* ===== ledger list ===== */
  .ledger{border-top:1px solid var(--border);}
  .tx-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 2px; border-bottom:1px solid var(--border); gap:10px; cursor:default; }
  .tx-main{min-width:0;}
  .tx-title{font-size:14.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tx-meta{font-size:12px; color:var(--text-muted); margin-top:5px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .tx-side{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .tx-amount{font-size:14.5px; font-weight:700; white-space:nowrap;}
  .tx-amount.income{color:var(--income);}
  .tx-amount.expense{color:var(--expense);}
  .tx-actions{display:flex; gap:4px;}
  .icon-btn{ background:transparent; border:1px solid transparent; color:var(--text-muted); width:26px; height:26px; border-radius:6px; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{border-color:var(--border); color:var(--text);}

  .pill{ display:inline-flex; align-items:center; gap:4px; border:1px solid var(--border); border-radius:999px; padding:2px 9px; font-size:11px; color:var(--text-muted); background:var(--surface-2); }
  .pill .dot{width:5px; height:5px; border-radius:50%; background:var(--text-muted);}

  .empty{ text-align:center; padding:50px 20px; color:var(--text-muted); font-size:13.5px; }

  .type-toggle{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .type-toggle button{ flex:1; background:var(--surface-2); border:none; color:var(--text-muted); padding:10px 0; font-size:13.5px; font-weight:500; }
  .type-toggle button.on.income{background:rgba(143,174,135,.15); color:var(--income);}
  .type-toggle button.on.expense{background:rgba(192,118,135,.15); color:var(--expense);}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .card-block{border:1px solid var(--border); border-radius:12px; padding:18px; background:var(--surface); margin-bottom:16px;}
  .card-block h3{font-size:14px; font-weight:600; margin-bottom:14px;}

  .period-fields{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}

  .select-row{display:flex; gap:8px; align-items:center;}
  .select-row select{flex:1;}

  .inline-add{ border:1px dashed var(--border); border-radius:8px; padding:10px; margin-top:8px; display:flex; flex-direction:column; gap:8px; }
  .inline-add .row2{display:flex; gap:8px;}
  .inline-add .row2 input{flex:1;}

  /* ===== about modal ===== */
  .about-btn{background:transparent; border:1px solid transparent; color:var(--text-muted); font-size:12.5px; padding:6px 10px; border-radius:999px; transition:color .15s, border-color .15s;}
  .about-btn:hover{color:var(--text); border-color:var(--border);}
  .about-link{background:none; border:none; color:var(--text-muted); font-size:12px; text-decoration:underline; text-underline-offset:3px; padding:0;}
  .about-link:hover{color:var(--text);}
  .about-overlay{position:fixed; inset:0; z-index:100; background:rgba(8,10,12,.72); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:16px; animation:aboutFade .15s ease;}
  .about-modal{position:relative; width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:28px 24px 22px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5); animation:aboutPop .18s ease;}
  .about-close{position:absolute; top:12px; inset-inline-start:12px; width:28px; height:28px; border-radius:50%; background:transparent; border:1px solid transparent; color:var(--text-muted); font-size:14px; line-height:1;}
  .about-close:hover{color:var(--text); border-color:var(--border);}
  .about-photo{width:104px; height:104px; border-radius:50%; object-fit:cover; border:1px solid var(--border); background:var(--bg); margin-bottom:14px;}
  .about-role{display:inline-block; font-size:11.5px; color:var(--income); border:1px solid var(--income-dim); border-radius:999px; padding:2px 12px; margin-bottom:8px;}
  .about-name{font-size:18px; font-weight:700;}
  .about-text{font-size:13px; color:var(--text-muted); line-height:1.95; margin:12px 0 18px;}
  .about-links{display:flex; flex-direction:column; gap:8px;}
  .about-links a{display:flex; align-items:center; gap:10px; padding:9px 14px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); color:var(--text); text-decoration:none; font-size:13px; transition:border-color .15s, transform .15s;}
  .about-links a:hover{border-color:var(--text-muted); transform:translateY(-1px);}
  .about-links svg{width:17px; height:17px; fill:currentColor; flex-shrink:0; color:var(--text-muted);}
  .about-links .lbl{flex:1; text-align:start;}
  .about-links .val{direction:ltr; font-size:11.5px; color:var(--text-muted);}
  @keyframes aboutFade{from{opacity:0}to{opacity:1}}
  @keyframes aboutPop{from{opacity:0; transform:translateY(8px) scale(.98)}to{opacity:1; transform:none}}

  /* ===== tooltip ===== */
  #tx-tooltip{
    position:fixed; z-index:50; max-width:260px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; font-size:12.5px; line-height:1.75; color:var(--text);
    opacity:0; pointer-events:none; transition:opacity .12s;
    box-shadow:0 10px 28px rgba(0,0,0,.4);
  }
  #tx-tooltip.show{opacity:1;}
  #tx-tooltip .tt-title{font-weight:700; margin-bottom:7px; font-size:13px;}
  #tx-tooltip .tt-desc{color:var(--text-muted); margin-bottom:8px; font-size:12px;}
  #tx-tooltip .tt-row{display:flex; justify-content:space-between; gap:14px; color:var(--text-muted); margin-bottom:2px;}
  #tx-tooltip .tt-row b{color:var(--text); font-weight:500;}

  /* ===== manage tab (categories & cards) ===== */
  .manage-list .tx-row:last-child{border-bottom:none;}
  .manage-form-row{display:flex; gap:8px; align-items:center; width:100%;}
  .manage-form-row input{
    flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:8px 10px; font-size:13.5px; outline:none;
  }
  .manage-form-row input:focus{border-color:var(--ring);}
  .card-num{direction:ltr; unicode-bidi:embed; letter-spacing:.5px;}
  .manage-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .manage-head h3{margin-bottom:0 !important;}

  @media(max-width:420px){
    .summary{grid-template-columns:1fr 1fr;}
    .summary .cell:last-child{grid-column:1 / -1;}
    .jdate-picker{grid-template-columns:1fr 1.2fr 1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="tx-tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
/* ============================================================
   Jalali (Persian) calendar — pure JS, no dependency
   ============================================================ */
(function () {
  function mod(a, b) { return a - ~~(a / b) * b; }
  function div(a, b) { return ~~(a / b); }
  const breaks = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

  function jalCal(jy) {
    const bl = breaks.length;
    const gy = jy + 621;
    let leapJ = -14, jp = breaks[0], jump = 0;
    if (jy < jp || jy >= breaks[bl - 1]) throw new Error('Invalid Jalaali year ' + jy);
    for (let i = 1; i < bl; i += 1) {
      const jm = breaks[i];
      jump = jm - jp;
      if (jy < jm) break;
      leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
      jp = jm;
    }
    let n = jy - jp;
    leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
    if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
    const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
    const march = 20 + leapJ - leapG;
    if (jump - n < 6) n = n - jump + div(jump, 33) * 33;
    let leap = mod(mod(n + 1, 33) - 1, 4);
    if (leap === -1) leap = 4;
    return { leap, gy, march };
  }

  function g2d(gy, gm, gd) {
    let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
    d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
    return d;
  }
  function d2g(jdn) {
    let j = 4 * jdn + 139361631;
    j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
    const i = div(mod(j, 1461), 4) * 5 + 308;
    const gd = div(mod(i, 153), 5) + 1;
    const gm = mod(div(i, 153), 12) + 1;
    const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
    return { gy, gm, gd };
  }
  function j2d(jy, jm, jd) {
    const r = jalCal(jy);
    return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
  }
  function d2j(jdn) {
    const gy = d2g(jdn).gy;
    let jy = gy - 621;
    const r = jalCal(jy);
    const jdn1f = g2d(gy, 3, r.march);
    let jm, jd, k = jdn - jdn1f;
    if (k >= 0) {
      if (k <= 185) { jm = 1 + div(k, 31); jd = mod(k, 31) + 1; return { jy, jm, jd }; }
      k -= 186;
    } else {
      jy -= 1; k += 179;
      if (r.leap === 1) k += 1;
    }
    jm = 7 + div(k, 30);
    jd = mod(k, 30) + 1;
    return { jy, jm, jd };
  }

  window.jalali = {
    toJalali: (gy, gm, gd) => { const j = d2j(g2d(gy, gm, gd)); return [j.jy, j.jm, j.jd]; },
    toGregorian: (jy, jm, jd) => { const g = d2g(j2d(jy, jm, jd)); return [g.gy, g.gm, g.gd]; },
    isLeap: (jy) => jalCal(jy).leap === 1,
  };
})();

const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WEEKDAYS_FA = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه']; // JS getDay(): 0=Sun..6=Sat

function faDigits(x) {
  return String(x).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}
function pad2(n) { return String(n).padStart(2, '0'); }

function jMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return jalali.isLeap(jy) ? 30 : 29;
}
function todayJalali() {
  const now = new Date();
  return jalali.toJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
}
/** "YYYY-MM-DD" gregorian string -> [jy,jm,jd] */
function gregStrToJalali(dateStr) {
  const [gy, gm, gd] = dateStr.split('-').map(Number);
  return jalali.toJalali(gy, gm, gd);
}
/** [jy,jm,jd] -> "YYYY-MM-DD" gregorian string, for API payloads */
function jalaliToGregStr(jy, jm, jd) {
  const [gy, gm, gd] = jalali.toGregorian(jy, jm, jd);
  return `${gy}-${pad2(gm)}-${pad2(gd)}`;
}
/** weekday name for a gregorian "YYYY-MM-DD" string */
function weekdayOf(dateStr) {
  const [gy, gm, gd] = dateStr.split('-').map(Number);
  return WEEKDAYS_FA[new Date(gy, gm - 1, gd).getDay()];
}
/** nice display "۲۹ شهریور ۱۴۰۵" from gregorian "YYYY-MM-DD" */
function displayJalali(dateStr, withWeekday) {
  const [jy, jm, jd] = gregStrToJalali(dateStr);
  const base = `${faDigits(jd)} ${JALALI_MONTHS[jm - 1]} ${faDigits(jy)}`;
  return withWeekday ? `${weekdayOf(dateStr)} ${base}` : base;
}
/** nice display from a jalali "YYYY-MM-DD" string (e.g. report start/end) */
function displayJalaliStr(jstr) {
  const [jy, jm, jd] = jstr.split('-').map(Number);
  return `${faDigits(jd)} ${JALALI_MONTHS[jm - 1]} ${faDigits(jy)}`;
}

function setState(patch) { Object.assign(state, patch); render(); }

/** disable a button and show a spinner + text while a request is in flight */
function setBtnLoading(btn, text) {
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>' + text;
}

function avatarUrl(n) { return `${API_BASE}/static/avatars/${n}.png`; }

async function loadProfile() {
  try {
    const data = await api('/api/account/profile/', { auth: true });
    setState({ avatar: data.avatar, email: data.email || '', joined: data.date_joined || '', username: data.username || state.username });
  } catch (e) { /* آواتار پیش‌فرض می‌ماند */ }
}

async function chooseAvatar(n) {
  const prev = state.avatar;
  setState({ avatar: n });          // اول نمایش می‌دهیم
  try {
    await api('/api/account/profile/', { method: 'PATCH', body: { avatar: n }, auth: true });
  } catch (e) {
    setState({ avatar: prev, error: e.message });             // اگر نشد، برمی‌گردانیم
  }
}

/* ---------------- API helper ---------------- */
async function api(path, { method = 'GET', body, auth = false, skipRefresh = false } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && state.access) headers['Authorization'] = 'Bearer ' + state.access;

  const res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });

  if (res.status === 401 && auth && !skipRefresh && state.refresh) {
    const refreshed = await tryRefresh();
    if (refreshed) return api(path, { method, body, auth, skipRefresh: true });
  }

  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }

  if (!res.ok) {
    const err = new Error(extractError(data));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function extractError(data) {
  if (!data) return 'خطای ناشناخته. اتصال به سرور را بررسی کنید.';
  if (data.detail) return typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
  const firstKey = Object.keys(data)[0];
  if (firstKey) {
    const val = data[firstKey];
    return Array.isArray(val) ? val[0] : String(val);
  }
  return 'خطایی رخ داد.';
}

async function tryRefresh() {
  try {
    const data = await api('/api/token/refresh/', { method: 'POST', body: { refresh: state.refresh } });
    state.access = data.access;
    localStorage.setItem('pl_access', data.access);
    return true;
  } catch (e) {
    logout();
    return false;
  }
}

/* ---- manage tab: add / edit / delete categories & cards ----
   NOTE: PATCH/DELETE go to /api/transaction/categories/<id>/ and /api/transaction/cards/<id>/ */
function manageFail(e, what) {
  if (e.status === 404 || e.status === 405)
    return `سرور هنوز «${what}» را پشتیبانی نمی‌کند (آدرس <id>/ برای این مورد در بک‌اند تعریف نشده).`;
  if (e.status >= 500) return 'خطای سرور. ممکن است مقدار تکراری باشد.';
  return e.message || 'عملیات ناموفق بود.';
}
function normalizeCardNumber(v) {
  const raw = String(v || '').trim();
  const compact = digitsOnly(raw);
  // if the input is only digits / spaces / dashes, store it compact; otherwise keep as typed
  return /^[\d۰-۹٠-٩\s-]+$/.test(raw) ? compact : raw;
}
function txCountBy(field, id) { return state.transactions.filter(t => Number(t[field]) === Number(id)).length; }

async function manageAddCategory(title) {

  if (!title) return;

    return setState({ manageError: 'این دسته‌بندی قبلاً وجود دارد.', manageInfo: '' });
  setState({ manageError: '', manageInfo: '' });

/* ---------------- helpers ---------------- */
/** normalize Persian/Arabic digits to latin and keep digits only */
function digitsOnly(str) {
  return String(str ?? '')
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[^0-9]/g, '');
}
/** "1234567" -> "1,234,567" (groups of 3 from the right) */
function groupThousands(str) {
  const d = digitsOnly(str).replace(/^0+(?=\d)/, '');
  return d.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtAmount(n) { return faDigits(Number(n).toLocaleString('en-US')) + ' تومان'; }

/** income/expense/balance for THIS jalali month only */
function monthTotals() {
  const [cjy, cjm] = todayJalali();
  let income = 0, expense = 0, allIncome = 0, allExpense = 0;
  for (const t of state.transactions) {
    const amt = Number(t.amount);
    if (t.type === 'income') allIncome += amt; else allExpense += amt;
    const [jy, jm] = gregStrToJalali(t.date);
    if (jy === cjy && jm === cjm) {
      if (t.type === 'income') income += amt; else expense += amt;
    }
  }
  // income/expense are for the current jalali month; balance is all-time
  return { income, expense, balance: allIncome - allExpense };
}

/** shared renderer for both the "list" tab and the report's transaction list */
function renderLedger(transactions) {
  if (!transactions.length) return `<div class="empty">تراکنشی برای نمایش نیست.</div>`;

  // newest day first; within the same day, the most recently created (highest id) first
  transactions = [...transactions].sort((a, b) =>
    a.date === b.date ? b.id - a.id : (a.date < b.date ? 1 : -1));

  txIndex = {};
  let html = '<div class="ledger">';
  let lastDate = null;
  for (const tx of transactions) {
    txIndex[tx.id] = tx;
    if (tx.date !== lastDate) {
      html += `<div class="day-sep"><span class="label">${displayJalali(tx.date, true)}</span><span class="line"></span></div>`;
      lastDate = tx.date;
    }
    const catPill = tx.category_title ? `<span class="pill">${escapeHtml(tx.category_title)}</span>` : '';
    const cardPill = tx.bank_name ? `<span class="pill"><span class="dot"></span>${escapeHtml(tx.bank_name)}${tx.card_number ? ' ·۴رقم ' + escapeHtml(String(tx.card_number).slice(-4)) : ''}</span>` : '';
    html += `
    <div class="tx-row" data-role="tx-hover" data-id="${tx.id}">
      <div class="tx-main">
        <div class="tx-title">${escapeHtml(tx.title)}</div>
        <div class="tx-meta">${catPill}${cardPill}</div>
      </div>
      <div class="tx-side">
        <div class="tx-amount ${tx.type}">${tx.type === 'income' ? '+' : '−'} ${fmtAmount(tx.amount)}</div>
        <div class="tx-actions">
          <button class="icon-btn" title="ویرایش" data-act="edit-tx" data-id="${tx.id}">✎</button>
          <button class="icon-btn" title="حذف" data-act="delete-tx" data-id="${tx.id}">✕</button>
        </div>
      </div>
    </div>`;
  }
  html += '</div>';
  return html;
}

function renderList() {
  if (state.loadingTx) return `<div class="empty">در حال بارگذاری…</div>`;
  if (!state.transactions.length) {

/* ---- jalali picker markup + wiring ---- */
function renderJalaliPicker(prefix, jy, jm, jd) {
  const [cjy] = todayJalali();
  let yearOpts = '';
  for (let y = cjy + 1; y >= cjy - 10; y--) yearOpts += `<option value="${y}" ${y===jy?'selected':''}>${faDigits(y)}</option>`;
  const monthOpts = JALALI_MONTHS.map((m,i) => `<option value="${i+1}" ${i+1===jm?'selected':''}>${m}</option>`).join('');
  const dayCount = jMonthLength(jy, jm);
  let dayOpts = '';
  for (let d = 1; d <= dayCount; d++) dayOpts += `<option value="${d}" ${d===jd?'selected':''}>${faDigits(d)}</option>`;
  return `
  <div class="jdate-picker" data-role="jdate-picker">
    <select data-role="jd-day" name="${prefix}_d">${dayOpts}</select>
    <select data-role="jd-month" name="${prefix}_m">${monthOpts}</select>
    <select data-role="jd-year" name="${prefix}_y">${yearOpts}</select>
  </div>`;
}

function bindAmountInputs(root) {
  root.querySelectorAll('[data-role="amount-input"]').forEach(inp => {
    inp.addEventListener('input', () => {
      const caret = inp.selectionStart ?? inp.value.length;
      const digitsBefore = digitsOnly(inp.value.slice(0, caret)).length;
      inp.value = groupThousands(inp.value);
      // restore caret after the same number of digits
      let pos = 0, seen = 0;
      while (pos < inp.value.length && seen < digitsBefore) { if (/\d/.test(inp.value[pos])) seen++; pos++; }
      try { inp.setSelectionRange(pos, pos); } catch (e) {}
    });
  });
}

function bindJalaliPickers(root) {
  root.querySelectorAll('[data-role="jdate-picker"]').forEach(picker => {
    const yearSel = picker.querySelector('[data-role="jd-year"]');
    const monthSel = picker.querySelector('[data-role="jd-month"]');
    const daySel = picker.querySelector('[data-role="jd-day"]');
    const regenDays = () => {
      const jy = Number(yearSel.value), jm = Number(monthSel.value);
      const cur = Number(daySel.value) || 1;
      const count = jMonthLength(jy, jm);
      const clamped = Math.min(cur, count);
      let opts = '';
      for (let d = 1; d <= count; d++) opts += `<option value="${d}" ${d===clamped?'selected':''}>${faDigits(d)}</option>`;
      daySel.innerHTML = opts;
    };
    yearSel.addEventListener('change', regenDays);
    monthSel.addEventListener('change', regenDays);
  });
}

/* ---- hover / click tooltip ---- */
function bindTooltips(root) {
  const tip = document.getElementById('tx-tooltip');
  root.querySelectorAll('[data-role="tx-hover"]').forEach(el => {
    const show = (evt) => {
      const tx = txIndex[el.dataset.id];
      if (!tx) return;
      tip.innerHTML = `
        <div class="tt-title">${escapeHtml(tx.title)}</div>
        ${tx.description ? `<div class="tt-desc">${escapeHtml(tx.description)}</div>` : ''}
        <div class="tt-row"><span>نوع</span><b>${tx.type === 'income' ? 'درآمد' : 'هزینه'}</b></div>
        <div class="tt-row"><span>مبلغ</span><b>${fmtAmount(tx.amount)}</b></div>
        <div class="tt-row"><span>تاریخ</span><b>${displayJalali(tx.date, true)}</b></div>
        ${tx.category_title ? `<div class="tt-row"><span>دسته‌بندی</span><b>${escapeHtml(tx.category_title)}</b></div>` : ''}
        ${tx.bank_name ? `<div class="tt-row"><span>کارت</span><b>${escapeHtml(tx.bank_name)} ${escapeHtml(tx.card_number || '')}</b></div>` : ''}
      `;
      const rect = el.getBoundingClientRect();
      let top = rect.bottom + 8;
      let left = rect.left;
      tip.style.top = top + 'px';
      tip.style.left = left + 'px';
      tip.classList.add('show');
      requestAnimationFrame(() => {
        const tr = tip.getBoundingClientRect();
        if (tr.right > window.innerWidth - 10) tip.style.left = (window.innerWidth - tr.width - 10) + 'px';
        if (tr.bottom > window.innerHeight - 10) tip.style.top = (rect.top - tr.height - 8) + 'px';
      });
    };
    const hide = () => tip.classList.remove('show');
    el.addEventListener('mouseenter', show);
    el.addEventListener('mouseleave', hide);
    el.addEventListener('click', (e) => {
      if (e.target.closest('.tx-actions')) return;
      tip.classList.contains('show') ? hide() : show();
    });
  });
}

/** donut chart of per-category totals for one transaction type (pure inline SVG, no libs) */
const CHART_COLORS = ['#8fae87', '#c07687', '#d4b483', '#7e9cb8', '#a98bb5', '#c9a27e', '#7fb5ae', '#b5b07e', '#8f969d'];
function renderCategoryChart(transactions, type, heading) {
  const sums = new Map();
  (transactions || []).forEach(t => {
    if (t.type !== type) return;
    const key = t.category_title || 'بدون دسته';
    sums.set(key, (sums.get(key) || 0) + Number(t.amount));
  });
  let items = [...sums.entries()].map(([name, total]) => ({ name, total })).sort((a, b) => b.total - a.total);
  if (!items.length) return '';
  const MAX = 8;
  if (items.length > MAX) {
    const rest = items.slice(MAX - 1).reduce((a, i) => a + i.total, 0);
    items = items.slice(0, MAX - 1).concat({ name: 'سایر', total: rest });
  }
  const sum = items.reduce((a, i) => a + i.total, 0);
  if (!(sum > 0)) return '';

  const R = 54, C = 2 * Math.PI * R, gap = items.length > 1 ? 1.5 : 0;
  let acc = 0;
  const segs = items.map((it, i) => {
    const frac = it.total / sum;
    const len = Math.max(0, frac * C - gap);
    const off = -acc;
    acc += frac * C;
    const pct = faDigits((frac * 100).toFixed(frac * 100 < 10 ? 1 : 0));
    return `<circle class="seg" cx="70" cy="70" r="${R}" fill="none" stroke="${CHART_COLORS[i % CHART_COLORS.length]}" stroke-width="20"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${off}"><title>${escapeHtml(it.name)}: ${fmtAmount(it.total)} (${pct}٪)</title></circle>`;
  }).join('');

  const legend = items.map((it, i) => {
    const frac = it.total / sum * 100;
    return `<div class="legend-row">
      <span class="legend-dot" style="background:${CHART_COLORS[i % CHART_COLORS.length]}"></span>
      <span class="legend-name" title="${escapeHtml(it.name)}">${escapeHtml(it.name)}</span>
      <span>${fmtAmount(it.total)}</span>
      <span class="legend-pct">${faDigits(frac.toFixed(frac < 10 ? 1 : 0))}٪</span>
    </div>`;
  }).join('');

  return `
  <div class="card-block" style="margin-top:14px;">
    <h3>${heading}</h3>
    <div class="chart-wrap">
      <svg class="donut" viewBox="0 0 140 140" role="img" aria-label="${heading}">
        <g transform="rotate(-90 70 70)">${segs}</g>
        <text x="70" y="66" text-anchor="middle" class="donut-total">مجموع</text>
        <text x="70" y="83" text-anchor="middle" class="donut-value">${faDigits(Math.round(sum).toLocaleString('en-US'))}</text>
      </svg>
      <div class="legend">${legend}</div>
    </div>
  </div>`;
}

/* ---------------- Excel export (ExcelJS, styled) ---------------- */
function jalaliSlash(dateStr) {            // gregorian "YYYY-MM-DD" -> "1405/06/29"
  const [jy, jm, jd] = gregStrToJalali(dateStr);
  return `${jy}/${pad2(jm)}/${pad2(jd)}`;
}

function buildReportWorkbook(r) {
  const NAVY = 'FF1F3864', BLUE = 'FF2F5597', LIGHT = 'FFDDE6F3', ZEBRA = 'FFF5F8FC', GREY = 'FF595959';
  const GREEN = 'FF1E7B34', GREEN_BG = 'FFE6F4EA', RED = 'FFC0392B', RED_BG = 'FFFCE8E6';
  const FONT = 'Tahoma', COLS = 10;
  const thin = { style: 'thin', color: { argb: 'FFBFBFBF' } };
  const BORDER = { top: thin, left: thin, bottom: thin, right: thin };
  const MONEY = '#,##0" تومان"';

  const txs = [...(r.transactions || [])].sort((a, b) =>
    a.date === b.date ? a.id - b.id : (a.date < b.date ? -1 : 1));
  const incomeTotal = Number(r.income_total), expenseTotal = Number(r.expense_total);
  const [ty, tm, td] = todayJalali();

  const wb = new ExcelJS.Workbook();
  wb.creator = 'دفترچه'; wb.created = new Date();
  const ws = wb.addWorksheet('گزارش', {
    views: [{ rightToLeft: true, showGridLines: false }],
    properties: { tabColor: { argb: 'FF1D6F42' } },
    pageSetup: { orientation: 'landscape', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0,
                 margins: { left: .4, right: .4, top: .5, bottom: .6, header: .3, footer: .3 } },
  });
  ws.headerFooter.oddFooter = '&C&"Tahoma"&9&P / &N';
  [6, 13, 12, 30, 10, 18, 16, 14, 14, 34].forEach((w, i) => { ws.getColumn(i + 1).width = w; });

  let row = 1;
  const put = (cell, value, o = {}) => {
    if (!o.skipValue) cell.value = value;      // merged slave cells proxy to the master, so never overwrite them
    cell.font = { name: FONT, size: o.size || 10, bold: !!o.bold, italic: !!o.italic, color: { argb: o.color || 'FF000000' } };
    if (o.fill) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: o.fill } };
    cell.alignment = { horizontal: o.align || 'center', vertical: 'middle', wrapText: !!o.wrap, indent: o.indent || 0, readingOrder: 'rtl' };
    if (o.fmt) cell.numFmt = o.fmt;
    if (o.border !== false && !o.noBorder) cell.border = BORDER;
  };
  const merged = (r1, c1, c2, value, o = {}) => {
    if (c2 > c1) ws.mergeCells(r1, c1, r1, c2);
    for (let c = c1; c <= c2; c++) put(ws.getCell(r1, c), value, c === c1 ? o : { ...o, skipValue: true });
  };
  const bar = (text, fill = BLUE) => {
    merged(row, 1, COLS, text, { bold: true, size: 11, color: 'FFFFFFFF', fill, align: 'right', indent: 1, noBorder: true });
    ws.getRow(row).height = 22; row++;
  };

  // ---- title block ----
  merged(row, 1, COLS, 'گزارش مالی دفترچه', { bold: true, size: 18, color: 'FFFFFFFF', fill: NAVY, noBorder: true });
  ws.getRow(row).height = 36; row++;
  merged(row, 1, COLS, `بازه گزارش:  از ${r.start_date.replaceAll('-', '/')}  تا  ${r.end_date.replaceAll('-', '/')}`,
    { bold: true, size: 11, fill: LIGHT, color: NAVY, noBorder: true });
  ws.getRow(row).height = 24; row++;
  merged(row, 1, COLS, `تهیه‌شده برای: ${state.username || '-'}     |     تاریخ تهیه: ${ty}/${pad2(tm)}/${pad2(td)}`,
    { size: 9, italic: true, color: GREY, noBorder: true });
  row += 2;

  // ---- financial summary ----
  bar('خلاصه مالی');
  const kpi = (label, value, o = {}) => {
    merged(row, 1, 3, label, { bold: true, align: 'right', indent: 1, fill: o.bg });
    put(ws.getCell(row, 4), value, { bold: true, fmt: o.fmt || MONEY, color: o.color, fill: o.bg });
    ws.getRow(row).height = 20; row++;
  };
  kpi('تعداد تراکنش‌ها', txs.length, { fmt: '#,##0', bg: ZEBRA });
  kpi('جمع درآمد', incomeTotal, { color: GREEN, bg: GREEN_BG });
  kpi('جمع هزینه', expenseTotal, { color: RED, bg: RED_BG });
  kpi('مانده', Number(r.balance), { color: Number(r.balance) >= 0 ? GREEN : RED, bg: LIGHT });
  row++;

  // ---- category breakdown tables ----
  const catTable = (title, type, total, fill) => {
    const by = {};
    for (const t of txs) if (t.type === type) {
      const k = t.category_title || 'بدون دسته';
      (by[k] = by[k] || { sum: 0, n: 0 });
      by[k].sum += Number(t.amount); by[k].n++;
    }
    const list = Object.entries(by).sort((a, b) => b[1].sum - a[1].sum);
    if (!list.length) return;
    bar(title, fill);
    merged(row, 1, 3, 'دسته‌بندی', { bold: true, fill: LIGHT, color: NAVY });
    ['مبلغ', 'سهم از کل', 'تعداد'].forEach((t, i) => put(ws.getCell(row, 4 + i), t, { bold: true, fill: LIGHT, color: NAVY }));
    row++;
    list.forEach(([name, v], i) => {
      const bg = i % 2 ? ZEBRA : undefined;
      merged(row, 1, 3, name, { align: 'right', indent: 1, fill: bg });
      put(ws.getCell(row, 4), v.sum, { fmt: MONEY, fill: bg });
      put(ws.getCell(row, 5), total ? v.sum / total : 0, { fmt: '0.0%', fill: bg });
      put(ws.getCell(row, 6), v.n, { fmt: '#,##0', fill: bg });
      row++;
    });
    row++;
  };
  catTable('هزینه‌ها بر اساس دسته‌بندی', 'expense', expenseTotal, RED);
  catTable('درآمدها بر اساس دسته‌بندی', 'income', incomeTotal, GREEN);

  // ---- full transaction list ----
  bar(`لیست کامل تراکنش‌ها  (${txs.length} مورد)`, NAVY);
  const heads = ['ردیف', 'تاریخ', 'روز هفته', 'عنوان', 'نوع', 'مبلغ', 'دسته‌بندی', 'بانک', 'کارت', 'توضیحات'];
  const headerRow = row;
  heads.forEach((t, i) => put(ws.getCell(row, i + 1), t, { bold: true, color: 'FFFFFFFF', fill: BLUE }));
  ws.getRow(row).height = 22; row++;
  if (!txs.length) {
    merged(row, 1, COLS, 'تراکنشی در این بازه ثبت نشده است.', { italic: true, color: GREY });
    row++;
  }
  txs.forEach((t, i) => {
    const bg = i % 2 ? ZEBRA : undefined;
    const inc = t.type === 'income';
    const card = t.card_number ? `•••• ${String(t.card_number).slice(-4)}` : '';
    const vals = [i + 1, jalaliSlash(t.date), weekdayOf(t.date), t.title, inc ? 'درآمد' : 'هزینه', Number(t.amount),
                  t.category_title || '', t.bank_name || '', card, t.description || ''];
    vals.forEach((v, c) => {
      const o = { fill: bg, wrap: c === 3 || c === 9 };
      if (c === 3 || c === 9 || c === 6) o.align = 'right';
      if (c === 4) { o.bold = true; o.color = inc ? GREEN : RED; }
      if (c === 5) { o.fmt = MONEY; o.color = inc ? GREEN : RED; o.bold = true; }
      put(ws.getCell(row, c + 1), v, o);
    });
    row++;
  });
  const lastTx = row - 1;
  if (txs.length) ws.autoFilter = { from: { row: headerRow, column: 1 }, to: { row: lastTx, column: COLS } };

  // ---- totals under the list ----
  const total = (label, value, color, bg) => {
    merged(row, 1, 5, label, { bold: true, align: 'right', indent: 1, fill: bg });
    put(ws.getCell(row, 6), value, { bold: true, fmt: MONEY, color, fill: bg });
    row++;
  };
  total('جمع درآمد', incomeTotal, GREEN, GREEN_BG);
  total('جمع هزینه', expenseTotal, RED, RED_BG);
  total('مانده', Number(r.balance), Number(r.balance) >= 0 ? GREEN : RED, LIGHT);
  return wb;
}

async function exportReportXlsx() {
  if (!state.report) return;
  if (typeof ExcelJS === 'undefined') {
    setState({ error: 'کتابخانه‌ی اکسل بارگذاری نشد. اتصال اینترنت را بررسی کن و صفحه را دوباره باز کن.' });
    return;
  }
  const r = state.report;
  try {
    const wb = buildReportWorkbook(r);
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `PocketLedger_${r.start_date}_to_${r.end_date}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (err) {
    console.error(err);
    setState({ error: 'ساخت فایل اکسل ناموفق بود.' });
  }
}

function renderReport() {
  const period = state.reportPeriod;
  const rf = state.reportForm || {};
  const [cjy, tjm, tjd] = todayJalali();
  const pick = (k, d) => String(rf[k] ?? d);      // remembered value, else default
  let yearOpts = '';
  for (let y = cjy + 1; y >= cjy - 10; y--) yearOpts += `<option value="${y}" ${String(y)===pick('year',cjy)?'selected':''}>${faDigits(y)}</option>`;
  const monthOpts = JALALI_MONTHS.map((m,i) => `<option value="${i+1}" ${String(i+1)===pick('month',tjm)?'selected':''}>${m}</option>`).join('');
  let dayOpts = ''; for (let d=1; d<=31; d++) dayOpts += `<option value="${d}" ${String(d)===pick('day',tjd)?'selected':''}>${faDigits(d)}</option>`;
  let weekOpts = ''; for (let w=1; w<=5; w++) weekOpts += `<option value="${w}" ${String(w)===pick('week_number',1)?'selected':''}>${faDigits(w)}</option>`;

  let extra = '';
  if (period === 'day') {
    extra = `<div class="period-fields">
      <div class="field"><label>سال</label><select name="year">${yearOpts}</select></div>
      <div class="field"><label>ماه</label><select name="month">${monthOpts}</select></div>
      <div class="field"><label>روز</label><select name="day">${dayOpts}</select></div>
    </div>`;
  } else if (period === 'month') {
    extra = `<div class="period-fields">
      <div class="field"><label>سال</label><select name="year">${yearOpts}</select></div>
      <div class="field"><label>ماه</label><select name="month">${monthOpts}</select></div>
    </div>`;
  } else if (period === 'year') {
    extra = `<div class="period-fields" style="grid-template-columns:1fr;">
      <div class="field"><label>سال</label><select name="year">${yearOpts}</select></div>
    </div>`;
  } else if (period === 'week') {
    extra = `<div class="period-fields">
      <div class="field"><label>سال</label><select name="year">${yearOpts}</select></div>
      <div class="field"><label>ماه</label><select name="month">${monthOpts}</select></div>
      <div class="field"><label>هفته</label><select name="week_number">${weekOpts}</select></div>
    </div>`;
  } else if (period === 'custom') {
    const [jy, jm, jd] = todayJalali();
    extra = `<div class="stack">
      <div class="field"><label>از تاریخ</label>${renderJalaliPicker('start', Number(rf.start_y ?? jy), Number(rf.start_m ?? jm), Number(rf.start_d ?? 1))}</div>
      <div class="field"><label>تا تاریخ</label>${renderJalaliPicker('end', Number(rf.end_y ?? jy), Number(rf.end_m ?? jm), Number(rf.end_d ?? jd))}</div>
    </div>`;
  }

  let resultHtml = '';
  if (state.reportError) {
    resultHtml = `<div class="error-box" style="margin-top:16px;">${escapeHtml(state.reportError)}</div>`;
  } else if (state.report) {
    const r = state.report;
    resultHtml = `
    <div class="summary" style="margin-top:18px;">
      <div class="cell income"><div class="label">درآمد</div><div class="value">${fmtAmount(r.income_total)}</div></div>
      <div class="cell expense"><div class="label">هزینه</div><div class="value">${fmtAmount(r.expense_total)}</div></div>
      <div class="cell"><div class="label">مانده</div><div class="value">${fmtAmount(r.balance)}</div></div>
    </div>
    <div class="spread" style="margin-top:10px; gap:10px; flex-wrap:wrap;">
      <p class="muted">بازه: ${displayJalaliStr(r.start_date)} تا ${displayJalaliStr(r.end_date)}</p>
      <button class="btn btn-excel" data-act="export-xlsx"><span class="xl-ico">X</span>دریافت فایل اکسل</button>
    </div>
    ${r.category_totals && r.category_totals.length ? `
      <div class="card-block" style="margin-top:14px;">
        <h3>بر اساس دسته‌بندی</h3>
        <div class="stack">
          ${r.category_totals.map(c => `<div class="spread"><span class="muted">${escapeHtml(c.category__title || 'بدون دسته')}</span><span>${fmtAmount(c.total)}</span></div>`).join('')}
        </div>
      </div>` : ''}
    ${renderCategoryChart(r.transactions, 'expense', 'نمودار هزینه‌ها بر اساس دسته‌بندی')}
    ${renderCategoryChart(r.transactions, 'income', 'نمودار درآمدها بر اساس دسته‌بندی')}
    ${r.transactions && r.transactions.length ? `
      <div style="margin-top:18px;">
        <h3 style="font-size:14px; font-weight:600; margin-bottom:10px;">تراکنش‌های این بازه</h3>
        ${renderLedger(r.transactions)}
      </div>` : `<div class="empty">تراکنشی در این بازه ثبت نشده.</div>`}
    `;
  }

  return `
  <div class="card-block">
    <h3>گزارش دوره‌ای</h3>
    <form data-act="report-form" class="stack">
      <div class="field">
        <label>بازه</label>
        <select name="period" data-role="period-select">
          <option value="day" ${period==='day'?'selected':''}>روز</option>
          <option value="week" ${period==='week'?'selected':''}>هفته</option>
          <option value="month" ${period==='month'?'selected':''}>ماه</option>
          <option value="year" ${period==='year'?'selected':''}>سال</option>
          <option value="custom" ${period==='custom'?'selected':''}>سفارشی</option>
        </select>
      </div>
      <div data-role="period-extra">${extra}</div>
      <button type="submit" class="btn btn-primary btn-block">دریافت گزارش</button>
    </form>
  </div>
  ${resultHtml}
  `;
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.aboutOpen) setState({ aboutOpen: false }); });

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   EVENTS (delegated)
   ============================================================ */
function bindEvents(root) {
  root.querySelectorAll('[data-act="auth-tab"]').forEach(el =>
    el.addEventListener('click', () => setState({ authTab: el.dataset.tab, error:'', info:'', registerStep:1 })));

  root.querySelectorAll('[data-act="app-tab"]').forEach(el =>
    el.addEventListener('click', () => {
      state.draftTx = null; // intentional navigation away/into the form resets any in-progress draft
      setState({ appTab: el.dataset.tab, editingId: el.dataset.tab==='form' ? state.editingId : null, error:'', showAddCategory:false, showAddCard:false, manageEditCat:null, manageEditCard:null, manageError:'', manageInfo:'', editingName:false, nameError:'' });
    }));

  const editNameBtn = root.querySelector('[data-act="edit-name"]');
  if (editNameBtn) editNameBtn.addEventListener('click', () => setState({ editingName: true, nameError: '' }));
  const cancelNameBtn = root.querySelector('[data-act="cancel-name"]');
  if (cancelNameBtn) cancelNameBtn.addEventListener('click', () => setState({ editingName: false, nameError: '' }));
  const nameForm = root.querySelector('[data-act="name-form"]');
  if (nameForm) {
    const inp = nameForm.querySelector('input');
    inp.focus(); inp.select();
    nameForm.addEventListener('submit', (e) => { e.preventDefault(); saveUsername(inp.value); });
  }

  const logoutBtn = root.querySelector('[data-act="logout"]');
  root.querySelectorAll('[data-act="pick-avatar"]').forEach(el =>
    el.addEventListener('click', () => chooseAvatar(Number(el.dataset.n))));
  if (logoutBtn) logoutBtn.addEventListener('click', logout);

  root.querySelectorAll('[data-act="open-about"]').forEach(el =>
    el.addEventListener('click', () => setState({ aboutOpen: true })));
  root.querySelectorAll('[data-act="close-about"]').forEach(el =>
    el.addEventListener('click', () => setState({ aboutOpen: false })));
  const aboutBackdrop = root.querySelector('[data-act="about-backdrop"]');
  if (aboutBackdrop) aboutBackdrop.addEventListener('click', (e) => { if (e.target === aboutBackdrop) setState({ aboutOpen: false }); });

  const loginForm = root.querySelector('[data-act="login-form"]');
  if (loginForm) loginForm.addEventListener('submit', (e) => { e.preventDefault(); const f = new FormData(loginForm); doLogin(f.get('username'), f.get('password')); });

  const otpSendForm = root.querySelector('[data-act="otp-send-form"]');

    e.preventDefault();
    const btn = otpSendForm.querySelector('button[type="submit"]');
    const email = new FormData(otpSendForm).get('email');
    setBtnLoading(btn, 'در حال ارسال…');
    try { await sendOtp(email); }
    finally { if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'ارسال کد تایید'; } }
  });

  const otpVerifyForm = root.querySelector('[data-act="otp-verify-form"]');
  if (otpVerifyForm) otpVerifyForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = otpVerifyForm.querySelector('button[type="submit"]');
    const code = new FormData(otpVerifyForm).get('otp_code');
    setBtnLoading(btn, 'در حال بررسی…');
    try { await verifyOtp(code); }
    finally { if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'تایید کد'; } }

  /* ---- forgot password wiring ---- */
  const gotoForgot = root.querySelector('[data-act="goto-forgot"]');
  if (gotoForgot) gotoForgot.addEventListener('click', (e) => {
    e.preventDefault();
    setState({ authTab: 'forgot', forgotStep: 1, forgotEmail: '', forgotToken: '', error: '', info: '' });
  });

  root.querySelectorAll('[data-act="back-to-login"]').forEach(el =>
    el.addEventListener('click', () => setState({ authTab: 'login', forgotStep: 1, forgotEmail: '', forgotToken: '', error: '', info: '' })));

  const forgotBackToEmail = root.querySelector('[data-act="forgot-back-to-email"]');

  const forgotSendForm = root.querySelector('[data-act="forgot-send-form"]');

      btn.classList.add('on', btn.dataset.type);

  const toggleAddCategory = root.querySelector('[data-act="toggle-add-category"]');

  const toggleAddCard = root.querySelector('[data-act="toggle-add-card"]');
  if (toggleAddCard) toggleAddCard.addEventListener('click', () => {
    captureDraft(root);
    setState({ showAddCard: !state.showAddCard });
  });

  const addCategoryBtn = root.querySelector('[data-act="add-category"]');
  if (addCategoryBtn) addCategoryBtn.addEventListener('click', async () => {
    const input = root.querySelector('[data-role="new-category-title"]');
    const title = input.value.trim();
    if (!title) return;
    captureDraft(root);
    try {
      const cat = await createCategory(title);
      if (state.draftTx) state.draftTx.category = String(cat.id);
      setState({ showAddCategory: false });
    } catch (e) { setState({ error: e.message }); }
  });

  const addCardBtn = root.querySelector('[data-act="add-card"]');
  if (addCardBtn) addCardBtn.addEventListener('click', async () => {
    const bank = root.querySelector('[data-role="new-card-bank"]').value.trim();
    const num = root.querySelector('[data-role="new-card-number"]').value.trim();
    if (!bank || !num) return;
    captureDraft(root);
    try {
      const card = await createCard(bank, num);
      if (state.draftTx) state.draftTx.card = String(card.id);
      setState({ showAddCard: false });
    } catch (e) { setState({ error: e.message }); }
  });

  const txForm = root.querySelector('[data-act="tx-form"]');
  if (txForm) txForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = new FormData(txForm);
    const dateStr = jalaliToGregStr(Number(f.get('date_y')), Number(f.get('date_m')), Number(f.get('date_d')));
    const payload = {
      title: f.get('title'),
      description: f.get('description') || '',
      type: f.get('type'),
      amount: Number(digitsOnly(f.get('amount'))),
      date: dateStr,
      category: f.get('category') ? Number(f.get('category')) : null,
      card: f.get('card') ? Number(f.get('card')) : null,
    };
    saveTransaction(payload, state.editingId);
  });

  /* ---- manage tab wiring ---- */
  const addCatForm = root.querySelector('[data-act="add-cat-form"]');
  if (addCatForm) addCatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    manageAddCategory(new FormData(addCatForm).get('title'));
  });
  const addCardForm = root.querySelector('[data-act="add-card-form"]');
  if (addCardForm) addCardForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = new FormData(addCardForm);
    manageAddCard(f.get('bank_name'), f.get('card_number'));
  });
  root.querySelectorAll('[data-act="edit-cat"]').forEach(el =>
    el.addEventListener('click', () => setState({ manageEditCat: Number(el.dataset.id), manageEditCard: null, manageError: '', manageInfo: '' })));
  root.querySelectorAll('[data-act="edit-card"]').forEach(el =>
    el.addEventListener('click', () => setState({ manageEditCard: Number(el.dataset.id), manageEditCat: null, manageError: '', manageInfo: '' })));
  root.querySelectorAll('[data-act="cancel-manage-edit"]').forEach(el =>
    el.addEventListener('click', () => setState({ manageEditCat: null, manageEditCard: null, manageError: '' })));
  root.querySelectorAll('[data-act="save-cat"]').forEach(form =>
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      manageSaveCategory(Number(form.dataset.id), new FormData(form).get('title'));
    }));
  root.querySelectorAll('[data-act="save-card"]').forEach(form =>
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const f = new FormData(form);
      manageSaveCard(Number(form.dataset.id), f.get('bank_name'), f.get('card_number'));
    }));
  root.querySelectorAll('[data-act="delete-cat"]').forEach(el =>
    el.addEventListener('click', () => manageDeleteCategory(Number(el.dataset.id))));
  root.querySelectorAll('[data-act="delete-card"]').forEach(el =>
    el.addEventListener('click', () => manageDeleteCard(Number(el.dataset.id))));

  const periodSelect = root.querySelector('[data-role="period-select"]');
  if (periodSelect) periodSelect.addEventListener('change', () => {
    const fm = root.querySelector('[data-act="report-form"]');
    if (fm) saveReportForm(fm);                       // keep what the user already picked
    setState({ reportPeriod: periodSelect.value, report: null, reportError: '' });
  });

  const exportBtn = root.querySelector('[data-act="export-xlsx"]');
  if (exportBtn) exportBtn.addEventListener('click', exportReportXlsx);

  const reportForm = root.querySelector('[data-act="report-form"]');
  if (reportForm) reportForm.addEventListener('change', () => saveReportForm(reportForm));
  if (reportForm) reportForm.addEventListener('submit', (e) => {
    e.preventDefault();
    saveReportForm(reportForm);
    const f = new FormData(reportForm);
    const params = { period: f.get('period') };
    if (state.reportPeriod === 'custom') {
      params.start_date = `${f.get('start_y')}-${pad2(f.get('start_m'))}-${pad2(f.get('start_d'))}`;
      params.end_date = `${f.get('end_y')}-${pad2(f.get('end_m'))}-${pad2(f.get('end_d'))}`;
    } else {
      for (const key of ['year','month','day','week_number']) {
        const v = f.get(key);
        if (v) params[key] = v;
      }
    }
    runReport(params);
  });
}

/* ---------------- global safety net ---------------- */
/* Surfaces unexpected JS errors in the UI + console instead of failing silently
   (which can look like "nothing happened" or the app reverting to its default screen). */
window.addEventListener('error', (e) => {
  console.error('Unhandled error:', e.error || e.message);
  if (state.view === 'auth') setState({ error: 'خطای غیرمنتظره: ' + (e.message || 'جزئیات در کنسول مرورگر') });
});
window.addEventListener('unhandledrejection', (e) => {
  console.error('Unhandled promise rejection:', e.reason);
  if (state.view === 'auth') setState({ error: 'خطای غیرمنتظره: ' + (e.reason && e.reason.message ? e.reason.message : 'جزئیات در کنسول مرورگر') });
});

/* ---------------- init ---------------- */
render();
if (state.view === 'app') bootstrapApp();
</script>
</body>
</html>

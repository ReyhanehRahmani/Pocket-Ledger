<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دفترچه — Pocket Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171a;
    --surface:#1b1f23;
    --surface-2:#20242a;
    --border:#2a2f35;
    --text:#e9e7e2;
    --text-muted:#8f969d;
    --income:#8fae87;
    --income-dim:#556a51;
    --expense:#c07687;
    --expense-dim:#6e4650;
    --ring:#dcd8ce;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Vazirmatn', sans-serif;
    font-feature-settings:'tnum' 1;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input, select, textarea{font-family:inherit;}
  select{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:9px 10px; font-size:13.5px; outline:none;
  }
  select:focus{border-color:var(--ring);}

  /* ===== utility ===== */
  .muted{color:var(--text-muted); font-size:13px;}
  .hidden{display:none !important;}
  .stack{display:flex; flex-direction:column; gap:12px;}
  .row{display:flex; gap:10px; align-items:center;}
  .spread{display:flex; justify-content:space-between; align-items:center;}

  /* ===== field ===== */
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:13px; color:var(--text-muted);}
  .field input, .field textarea{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-size:14.5px;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus, .field textarea:focus{ border-color:var(--ring); }
  .field textarea{resize:vertical; min-height:60px;}
  .hint{font-size:12px; color:var(--text-muted);}

  /* ===== jalali date picker ===== */
  .jdate-picker{display:grid; grid-template-columns:1fr 1.35fr 1fr; gap:8px;}
  .jdate-picker select{width:100%;}

  /* ===== buttons ===== */
  .btn{
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    padding:10px 16px;
    border-radius:8px;
    font-size:14px;
    font-weight:500;
    transition:border-color .15s, opacity .15s;
  }
  .btn:hover{border-color:var(--ring);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-primary{
    background:var(--ring);
    color:#15181b;
    border-color:var(--ring);
    font-weight:600;
  }
  .btn-primary:hover{opacity:.9; border-color:var(--ring);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--text-muted);}
  .btn-ghost:hover{color:var(--text); border-color:var(--border);}
  .btn-danger{color:var(--expense); border-color:var(--expense-dim); background:transparent;}
  .btn-danger:hover{background:var(--expense-dim); color:var(--text);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 10px; font-size:12.5px; border-radius:6px;}
  .btn-xs{padding:4px 9px; font-size:11.5px; border-radius:6px;}

  /* ===== auth screen ===== */
  .auth-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:100%; max-width:380px; border:1px solid var(--border); background:var(--surface); border-radius:14px; padding:28px 26px; }
  .brand{text-align:center; margin-bottom:22px;}
  .brand .mark{ display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border:1px solid var(--border); border-radius:10px; margin-bottom:10px; font-size:18px; }
  .brand h1{font-size:17px; font-weight:600;}
  .brand p{font-size:12.5px; color:var(--text-muted); margin-top:4px;}

  .tabs{display:flex; border:1px solid var(--border); border-radius:9px; padding:3px; margin-bottom:20px;}
  .tabs button{ flex:1; background:transparent; border:none; border-radius:6px; padding:8px 0; font-size:13.5px; color:var(--text-muted); }
  .tabs button.active{background:var(--surface-2); color:var(--text); font-weight:600;}

  .error-box{ background:rgba(192,118,135,.1); border:1px solid var(--expense-dim); color:var(--expense); font-size:13px; padding:9px 12px; border-radius:8px; }
  .ok-box{ background:rgba(143,174,135,.1); border:1px solid var(--income-dim); color:var(--income); font-size:13px; padding:9px 12px; border-radius:8px; }
  .step-dots{display:flex; gap:6px; justify-content:center; margin-bottom:18px;}
  .step-dots span{width:6px; height:6px; border-radius:50%; background:var(--border);}
  .step-dots span.active{background:var(--ring);}

  /* ===== app shell ===== */
  .topbar{ border-bottom:1px solid var(--border); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--bg); z-index:5; }
  .topbar .brand-inline{display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px;}
  .topbar .mark-sm{ width:26px; height:26px; border:1px solid var(--border); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .main{max-width:640px; width:100%; margin:0 auto; padding:20px; flex:1;}

  /* ===== summary ===== */
  .summary-label{font-size:12.5px; color:var(--text-muted); margin-bottom:8px;}
  .summary{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:20px; background:var(--border); }
  .summary .cell{background:var(--surface); padding:16px 14px;}
  .summary .cell .label{font-size:12px; color:var(--text-muted); margin-bottom:6px;}
  .summary .cell .value{font-size:16px; font-weight:700; letter-spacing:.2px;}
  .summary .income .value{color:var(--income);}
  .summary .expense .value{color:var(--expense);}

  /* ===== tabs nav ===== */
  .nav{display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:18px;}
  .nav button{ background:transparent; border:none; color:var(--text-muted); padding:9px 4px; font-size:13.5px; position:relative; margin-left:14px; }
  .nav button.active{color:var(--text); font-weight:600;}
  .nav button.active::after{ content:''; position:absolute; right:0; left:0; bottom:-1px; height:2px; background:var(--ring); }

  /* ===== day grouping ===== */
  .day-sep{display:flex; align-items:center; gap:10px; margin:20px 0 4px;}
  .day-sep:first-child{margin-top:0;}
  .day-sep .line{flex:1; height:1px; background:var(--border);}
  .day-sep .label{font-size:12px; color:var(--text-muted); white-space:nowrap; font-weight:500;}

  /* ===== ledger list ===== */
  .ledger{border-top:1px solid var(--border);}
  .tx-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 2px; border-bottom:1px solid var(--border); gap:10px; cursor:default; }
  .tx-main{min-width:0;}
  .tx-title{font-size:14.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tx-meta{font-size:12px; color:var(--text-muted); margin-top:5px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .tx-side{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .tx-amount{font-size:14.5px; font-weight:700; white-space:nowrap;}
  .tx-amount.income{color:var(--income);}
  .tx-amount.expense{color:var(--expense);}
  .tx-actions{display:flex; gap:4px;}
  .icon-btn{ background:transparent; border:1px solid transparent; color:var(--text-muted); width:26px; height:26px; border-radius:6px; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{border-color:var(--border); color:var(--text);}

  .pill{ display:inline-flex; align-items:center; gap:4px; border:1px solid var(--border); border-radius:999px; padding:2px 9px; font-size:11px; color:var(--text-muted); background:var(--surface-2); }
  .pill .dot{width:5px; height:5px; border-radius:50%; background:var(--text-muted);}

  .empty{ text-align:center; padding:50px 20px; color:var(--text-muted); font-size:13.5px; }

  .type-toggle{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .type-toggle button{ flex:1; background:var(--surface-2); border:none; color:var(--text-muted); padding:10px 0; font-size:13.5px; font-weight:500; }
  .type-toggle button.on.income{background:rgba(143,174,135,.15); color:var(--income);}
  .type-toggle button.on.expense{background:rgba(192,118,135,.15); color:var(--expense);}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .card-block{border:1px solid var(--border); border-radius:12px; padding:18px; background:var(--surface); margin-bottom:16px;}
  .card-block h3{font-size:14px; font-weight:600; margin-bottom:14px;}

  .period-fields{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}

  .select-row{display:flex; gap:8px; align-items:center;}
  .select-row select{flex:1;}

  .inline-add{ border:1px dashed var(--border); border-radius:8px; padding:10px; margin-top:8px; display:flex; flex-direction:column; gap:8px; }
  .inline-add .row2{display:flex; gap:8px;}
  .inline-add .row2 input{flex:1;}

  footer.credit{text-align:center; padding:24px; color:var(--text-muted); font-size:11.5px;}

  /* ===== tooltip ===== */
  #tx-tooltip{
    position:fixed; z-index:50; max-width:260px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; font-size:12.5px; line-height:1.75; color:var(--text);
    opacity:0; pointer-events:none; transition:opacity .12s;
    box-shadow:0 10px 28px rgba(0,0,0,.4);
  }
  #tx-tooltip.show{opacity:1;}
  #tx-tooltip .tt-title{font-weight:700; margin-bottom:7px; font-size:13px;}
  #tx-tooltip .tt-desc{color:var(--text-muted); margin-bottom:8px; font-size:12px;}
  #tx-tooltip .tt-row{display:flex; justify-content:space-between; gap:14px; color:var(--text-muted); margin-bottom:2px;}
  #tx-tooltip .tt-row b{color:var(--text); font-weight:500;}

  @media(max-width:420px){
    .summary{grid-template-columns:1fr 1fr;}
    .summary .cell:last-child{grid-column:1 / -1;}
    .jdate-picker{grid-template-columns:1fr 1.2fr 1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="tx-tooltip"></div>

<script>
/* ============================================================
   Jalali (Persian) calendar — pure JS, no dependency
   ============================================================ */
(function () {
  function mod(a, b) { return a - ~~(a / b) * b; }
  function div(a, b) { return ~~(a / b); }
  const breaks = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

  function jalCal(jy) {
    const bl = breaks.length;
    const gy = jy + 621;
    let leapJ = -14, jp = breaks[0], jump = 0;
    if (jy < jp || jy >= breaks[bl - 1]) throw new Error('Invalid Jalaali year ' + jy);
    for (let i = 1; i < bl; i += 1) {
      const jm = breaks[i];
      jump = jm - jp;
      if (jy < jm) break;
      leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
      jp = jm;
    }
    let n = jy - jp;
    leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
    if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
    const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
    const march = 20 + leapJ - leapG;
    if (jump - n < 6) n = n - jump + div(jump, 33) * 33;
    let leap = mod(mod(n + 1, 33) - 1, 4);
    if (leap === -1) leap = 4;
    return { leap, gy, march };
  }

  function g2d(gy, gm, gd) {
    let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
    d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
    return d;
  }
  function d2g(jdn) {
    let j = 4 * jdn + 139361631;
    j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
    const i = div(mod(j, 1461), 4) * 5 + 308;
    const gd = div(mod(i, 153), 5) + 1;
    const gm = mod(div(i, 153), 12) + 1;
    const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
    return { gy, gm, gd };
  }
  function j2d(jy, jm, jd) {
    const r = jalCal(jy);
    return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
  }
  function d2j(jdn) {
    const gy = d2g(jdn).gy;
    let jy = gy - 621;
    const r = jalCal(jy);
    const jdn1f = g2d(gy, 3, r.march);
    let jm, jd, k = jdn - jdn1f;
    if (k >= 0) {
      if (k <= 185) { jm = 1 + div(k, 31); jd = mod(k, 31) + 1; return { jy, jm, jd }; }
      k -= 186;
    } else {
      jy -= 1; k += 179;
      if (r.leap === 1) k += 1;
    }
    jm = 7 + div(k, 30);
    jd = mod(k, 30) + 1;
    return { jy, jm, jd };
  }

  window.jalali = {
    toJalali: (gy, gm, gd) => { const j = d2j(g2d(gy, gm, gd)); return [j.jy, j.jm, j.jd]; },
    toGregorian: (jy, jm, jd) => { const g = d2g(j2d(jy, jm, jd)); return [g.gy, g.gm, g.gd]; },
    isLeap: (jy) => jalCal(jy).leap === 1,
  };
})();

const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WEEKDAYS_FA = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه']; // JS getDay(): 0=Sun..6=Sat

function faDigits(x) {
  return String(x).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}
function pad2(n) { return String(n).padStart(2, '0'); }

function jMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return jalali.isLeap(jy) ? 30 : 29;
}
function todayJalali() {
  const now = new Date();
  return jalali.toJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
}
/** "YYYY-MM-DD" gregorian string -> [jy,jm,jd] */
function gregStrToJalali(dateStr) {
  const [gy, gm, gd] = dateStr.split('-').map(Number);
  return jalali.toJalali(gy, gm, gd);
}
/** [jy,jm,jd] -> "YYYY-MM-DD" gregorian string, for API payloads */
function jalaliToGregStr(jy, jm, jd) {
  const [gy, gm, gd] = jalali.toGregorian(jy, jm, jd);
  return `${gy}-${pad2(gm)}-${pad2(gd)}`;
}
/** weekday name for a gregorian "YYYY-MM-DD" string */
function weekdayOf(dateStr) {
  const [gy, gm, gd] = dateStr.split('-').map(Number);
  return WEEKDAYS_FA[new Date(gy, gm - 1, gd).getDay()];
}
/** nice display "۲۹ شهریور ۱۴۰۵" from gregorian "YYYY-MM-DD" */
function displayJalali(dateStr, withWeekday) {
  const [jy, jm, jd] = gregStrToJalali(dateStr);
  const base = `${faDigits(jd)} ${JALALI_MONTHS[jm - 1]} ${faDigits(jy)}`;
  return withWeekday ? `${weekdayOf(dateStr)} ${base}` : base;
}
/** nice display from a jalali "YYYY-MM-DD" string (e.g. report start/end) */
function displayJalaliStr(jstr) {
  const [jy, jm, jd] = jstr.split('-').map(Number);
  return `${faDigits(jd)} ${JALALI_MONTHS[jm - 1]} ${faDigits(jy)}`;
}

/* ============================================================
   App state
   ============================================================ */
let API_BASE = localStorage.getItem('pl_api_base') || 'http://127.0.0.1:8000';

const state = {
  view: localStorage.getItem('pl_access') ? 'app' : 'auth',
  authTab: 'login',
  registerStep: 1,
  regEmail: '',
  regToken: '',
  access: localStorage.getItem('pl_access') || null,
  refresh: localStorage.getItem('pl_refresh') || null,
  username: localStorage.getItem('pl_username') || '',
  appTab: 'list',
  transactions: [],
  categories: [],
  cards: [],
  loadingTx: false,
  error: '',
  info: '',
  editingId: null,
  showAddCategory: false,
  showAddCard: false,
  report: null,
  reportPeriod: 'month',
  reportError: '',
};

function setState(patch) { Object.assign(state, patch); render(); }

/* ---------------- API helper ---------------- */
async function api(path, { method = 'GET', body, auth = false, skipRefresh = false } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && state.access) headers['Authorization'] = 'Bearer ' + state.access;

  const res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });

  if (res.status === 401 && auth && !skipRefresh && state.refresh) {
    const refreshed = await tryRefresh();
    if (refreshed) return api(path, { method, body, auth, skipRefresh: true });
  }

  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }

  if (!res.ok) {
    const err = new Error(extractError(data));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function extractError(data) {
  if (!data) return 'خطای ناشناخته. اتصال به سرور را بررسی کنید.';
  if (data.detail) return typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
  const firstKey = Object.keys(data)[0];
  if (firstKey) {
    const val = data[firstKey];
    return Array.isArray(val) ? val[0] : String(val);
  }
  return 'خطایی رخ داد.';
}

async function tryRefresh() {
  try {
    const data = await api('/api/token/refresh/', { method: 'POST', body: { refresh: state.refresh } });
    state.access = data.access;
    localStorage.setItem('pl_access', data.access);
    return true;
  } catch (e) {
    logout();
    return false;
  }
}

/* ---------------- Auth actions ---------------- */
async function doLogin(username, password) {
  setState({ error: '', info: '' });
  try {
    const data = await api('/api/token/', { method: 'POST', body: { username, password } });
    state.access = data.access;
    state.refresh = data.refresh;
    state.username = username;
    localStorage.setItem('pl_access', data.access);
    localStorage.setItem('pl_refresh', data.refresh);
    localStorage.setItem('pl_username', username);
    setState({ view: 'app' });
    bootstrapApp();
  } catch (e) {
    setState({ error: e.message || 'ورود ناموفق بود.' });
  }
}

async function sendOtp(email) {
  setState({ error: '', info: '' });
  try {
    const data = await api('/api/account/otp/send/', { method: 'POST', body: { email } });
    setState({ regEmail: email, registerStep: 2, info: (data && data.detail) || 'کد تایید ارسال شد.' });
  } catch (e) { setState({ error: e.message || 'ارسال کد ناموفق بود.' }); }
}

async function verifyOtp(code) {
  setState({ error: '', info: '' });
  try {
    const data = await api('/api/account/otp/verify/', { method: 'POST', body: { email: state.regEmail, otp_code: code } });
    if (!data || !data.verification_token) throw new Error('پاسخ نامعتبر از سرور دریافت شد.');
    setState({ regToken: data.verification_token, registerStep: 3, info: '' });
  } catch (e) { setState({ error: e.message || 'تایید کد ناموفق بود.' }); }
}

async function completeRegister(username, password) {
  setState({ error: '', info: '' });
  try {
    const data = await api('/api/account/register/', { method: 'POST', body: { username, password, verification_token: state.regToken } });
    state.access = data.access;
    state.refresh = data.refresh;
    state.username = data.username;
    localStorage.setItem('pl_access', data.access);
    localStorage.setItem('pl_refresh', data.refresh);
    localStorage.setItem('pl_username', data.username);
    setState({ view: 'app', registerStep: 1, regEmail: '', regToken: '' });
    bootstrapApp();
  } catch (e) { setState({ error: e.message }); }
}

function logout() {
  localStorage.removeItem('pl_access');
  localStorage.removeItem('pl_refresh');
  localStorage.removeItem('pl_username');
  Object.assign(state, {
    view: 'auth', access: null, refresh: null, username: '', transactions: [],
    categories: [], cards: [], authTab: 'login', registerStep: 1, error: '', info: '', report: null,
  });
  render();
}

/* ---------------- Transactions / categories / cards ---------------- */
async function loadTransactions() {
  setState({ loadingTx: true, error: '' });
  try {
    const data = await api('/api/transaction/all-transactions/', { auth: true });
    setState({ transactions: data, loadingTx: false });
  } catch (e) { setState({ loadingTx: false, error: e.message }); }
}

async function loadCategories() {
  try { state.categories = await api('/api/transaction/categories/', { auth: true }); render(); }
  catch (e) { /* non-fatal */ }
}
async function loadCards() {
  try { state.cards = await api('/api/transaction/cards/', { auth: true }); render(); }
  catch (e) { /* non-fatal */ }
}
function bootstrapApp() {
  loadTransactions();
  loadCategories();
  loadCards();
}

async function createCategory(title) {
  const cat = await api('/api/transaction/categories/', { method: 'POST', body: { title }, auth: true });
  state.categories.push(cat);
  return cat;
}
async function createCard(bank_name, card_number) {
  const card = await api('/api/transaction/cards/', { method: 'POST', body: { bank_name, card_number }, auth: true });
  state.cards.push(card);
  return card;
}

async function saveTransaction(payload, id) {
  setState({ error: '' });
  try {
    if (id) await api(`/api/transaction/update/${id}/`, { method: 'PATCH', body: payload, auth: true });
    else await api('/api/transaction/create/', { method: 'POST', body: payload, auth: true });
    setState({ editingId: null, appTab: 'list' });
    loadTransactions();
  } catch (e) { setState({ error: e.message }); }
}

async function deleteTransaction(id) {
  if (!confirm('این تراکنش حذف شود؟')) return;
  try {
    await api(`/api/transaction/delete/${id}/`, { method: 'DELETE', auth: true });
    loadTransactions();
  } catch (e) { setState({ error: e.message }); }
}

async function runReport(params) {
  setState({ reportError: '', report: null });
  const qs = new URLSearchParams(params).toString();
  try {
    const data = await api('/api/transaction/report/?' + qs, { auth: true });
    setState({ report: data });
  } catch (e) { setState({ reportError: e.message }); }
}

/* ---------------- helpers ---------------- */
function fmtAmount(n) { return faDigits(Number(n).toLocaleString('en-US')) + ' تومان'; }

/** income/expense/balance for THIS jalali month only */
function monthTotals() {
  const [cjy, cjm] = todayJalali();
  let income = 0, expense = 0;
  for (const t of state.transactions) {
    const [jy, jm] = gregStrToJalali(t.date);
    if (jy === cjy && jm === cjm) {
      if (t.type === 'income') income += Number(t.amount);
      else expense += Number(t.amount);
    }
  }
  return { income, expense, balance: income - expense };
}

/** shared renderer for both the "list" tab and the report's transaction list */
function renderLedger(transactions) {
  if (!transactions.length) return `<div class="empty">تراکنشی برای نمایش نیست.</div>`;

  txIndex = {};
  let html = '<div class="ledger">';
  let lastDate = null;
  for (const tx of transactions) {
    txIndex[tx.id] = tx;
    if (tx.date !== lastDate) {
      html += `<div class="day-sep"><span class="label">${displayJalali(tx.date, true)}</span><span class="line"></span></div>`;
      lastDate = tx.date;
    }
    const catPill = tx.category_title ? `<span class="pill">${escapeHtml(tx.category_title)}</span>` : '';
    const cardPill = tx.bank_name ? `<span class="pill"><span class="dot"></span>${escapeHtml(tx.bank_name)}${tx.card_number ? ' ·۴رقم ' + escapeHtml(String(tx.card_number).slice(-4)) : ''}</span>` : '';
    html += `
    <div class="tx-row" data-role="tx-hover" data-id="${tx.id}">
      <div class="tx-main">
        <div class="tx-title">${escapeHtml(tx.title)}</div>
        <div class="tx-meta">${catPill}${cardPill}</div>
      </div>
      <div class="tx-side">
        <div class="tx-amount ${tx.type}">${tx.type === 'income' ? '+' : '−'} ${fmtAmount(tx.amount)}</div>
        <div class="tx-actions">
          <button class="icon-btn" title="ویرایش" data-act="edit-tx" data-id="${tx.id}">✎</button>
          <button class="icon-btn" title="حذف" data-act="delete-tx" data-id="${tx.id}">✕</button>
        </div>
      </div>
    </div>`;
  }
  html += '</div>';
  return html;
}

/* ---- jalali picker markup + wiring ---- */
function renderJalaliPicker(prefix, jy, jm, jd) {
  const [cjy] = todayJalali();
  let yearOpts = '';
  for (let y = cjy + 1; y >= cjy - 10; y--) yearOpts += `<option value="${y}" ${y===jy?'selected':''}>${faDigits(y)}</option>`;
  const monthOpts = JALALI_MONTHS.map((m,i) => `<option value="${i+1}" ${i+1===jm?'selected':''}>${m}</option>`).join('');
  const dayCount = jMonthLength(jy, jm);
  let dayOpts = '';
  for (let d = 1; d <= dayCount; d++) dayOpts += `<option value="${d}" ${d===jd?'selected':''}>${faDigits(d)}</option>`;
  return `
  <div class="jdate-picker" data-role="jdate-picker">
    <select data-role="jd-day" name="${prefix}_d">${dayOpts}</select>
    <select data-role="jd-month" name="${prefix}_m">${monthOpts}</select>
    <select data-role="jd-year" name="${prefix}_y">${yearOpts}</select>
  </div>`;
}

function bindJalaliPickers(root) {
  root.querySelectorAll('[data-role="jdate-picker"]').forEach(picker => {
    const yearSel = picker.querySelector('[data-role="jd-year"]');
    const monthSel = picker.querySelector('[data-role="jd-month"]');
    const daySel = picker.querySelector('[data-role="jd-day"]');
    const regenDays = () => {
      const jy = Number(yearSel.value), jm = Number(monthSel.value);
      const cur = Number(daySel.value) || 1;
      const count = jMonthLength(jy, jm);
      const clamped = Math.min(cur, count);
      let opts = '';
      for (let d = 1; d <= count; d++) opts += `<option value="${d}" ${d===clamped?'selected':''}>${faDigits(d)}</option>`;
      daySel.innerHTML = opts;
    };
    yearSel.addEventListener('change', regenDays);
    monthSel.addEventListener('change', regenDays);
  });
}

/* ---- hover / click tooltip ---- */
function bindTooltips(root) {
  const tip = document.getElementById('tx-tooltip');
  root.querySelectorAll('[data-role="tx-hover"]').forEach(el => {
    const show = (evt) => {
      const tx = txIndex[el.dataset.id];
      if (!tx) return;
      tip.innerHTML = `
        <div class="tt-title">${escapeHtml(tx.title)}</div>
        ${tx.description ? `<div class="tt-desc">${escapeHtml(tx.description)}</div>` : ''}
        <div class="tt-row"><span>نوع</span><b>${tx.type === 'income' ? 'درآمد' : 'هزینه'}</b></div>
        <div class="tt-row"><span>مبلغ</span><b>${fmtAmount(tx.amount)}</b></div>
        <div class="tt-row"><span>تاریخ</span><b>${displayJalali(tx.date, true)}</b></div>
        ${tx.category_title ? `<div class="tt-row"><span>دسته‌بندی</span><b>${escapeHtml(tx.category_title)}</b></div>` : ''}
        ${tx.bank_name ? `<div class="tt-row"><span>کارت</span><b>${escapeHtml(tx.bank_name)} ${escapeHtml(tx.card_number || '')}</b></div>` : ''}
      `;
      const rect = el.getBoundingClientRect();
      let top = rect.bottom + 8;
      let left = rect.left;
      tip.style.top = top + 'px';
      tip.style.left = left + 'px';
      tip.classList.add('show');
      requestAnimationFrame(() => {
        const tr = tip.getBoundingClientRect();
        if (tr.right > window.innerWidth - 10) tip.style.left = (window.innerWidth - tr.width - 10) + 'px';
        if (tr.bottom > window.innerHeight - 10) tip.style.top = (rect.top - tr.height - 8) + 'px';
      });
    };
    const hide = () => tip.classList.remove('show');
    el.addEventListener('mouseenter', show);
    el.addEventListener('mouseleave', hide);
    el.addEventListener('click', (e) => {
      if (e.target.closest('.tx-actions')) return;
      tip.classList.contains('show') ? hide() : show();
    });
  });
}

  } else if (state.report) {

    ${r.category_totals && r.category_totals.length ? `
      <div class="card-block" style="margin-top:14px;">
        <h3>بر اساس دسته‌بندی</h3>
        <div class="stack">
          ${r.category_totals.map(c => `<div class="spread"><span class="muted">${escapeHtml(c.category__title || 'بدون دسته')}</span><span>${fmtAmount(c.total)}</span></div>`).join('')}
        </div>
      </div>` : ''}
    ${r.transactions && r.transactions.length ? `

        <h3 style="font-size:14px; font-weight:600; margin-bottom:10px;">تراکنش‌های این بازه</h3>

          <option value="month" ${period==='month'?'selected':''}>ماه</option>

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   EVENTS (delegated)
   ============================================================ */
function bindEvents(root) {
  root.querySelectorAll('[data-act="auth-tab"]').forEach(el =>
    el.addEventListener('click', () => setState({ authTab: el.dataset.tab, error:'', info:'', registerStep:1 })));

  root.querySelectorAll('[data-act="app-tab"]').forEach(el =>
    el.addEventListener('click', () => setState({ appTab: el.dataset.tab, editingId: el.dataset.tab==='form' ? state.editingId : null, error:'', showAddCategory:false, showAddCard:false })));

  const logoutBtn = root.querySelector('[data-act="logout"]');
  if (logoutBtn) logoutBtn.addEventListener('click', logout);

  const editBase = root.querySelector('[data-act="edit-api-base"]');
  if (editBase) editBase.addEventListener('click', (e) => {
    e.preventDefault();
    const val = prompt('آدرس سرور بک‌اند را وارد کنید:', API_BASE);
    if (val) { API_BASE = val.replace(/\/$/, ''); localStorage.setItem('pl_api_base', API_BASE); render(); }
  });

  const loginForm = root.querySelector('[data-act="login-form"]');
  if (loginForm) loginForm.addEventListener('submit', (e) => { e.preventDefault(); const f = new FormData(loginForm); doLogin(f.get('username'), f.get('password')); });

  const otpSendForm = root.querySelector('[data-act="otp-send-form"]');
  if (otpSendForm) otpSendForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = otpSendForm.querySelector('button[type="submit"]');
    const email = new FormData(otpSendForm).get('email');
    btn.disabled = true; btn.textContent = 'در حال ارسال…';
    try { await sendOtp(email); }
    finally { if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'ارسال کد تایید'; } }
  });

  const otpVerifyForm = root.querySelector('[data-act="otp-verify-form"]');
  if (otpVerifyForm) otpVerifyForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = otpVerifyForm.querySelector('button[type="submit"]');
    const code = new FormData(otpVerifyForm).get('otp_code');
    btn.disabled = true; btn.textContent = 'در حال بررسی…';
    try { await verifyOtp(code); }
    finally { if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'تایید کد'; } }
  });

  const backToEmail = root.querySelector('[data-act="back-to-email"]');
  if (backToEmail) backToEmail.addEventListener('click', () => setState({ registerStep: 1, error:'', info:'' }));

  const registerForm = root.querySelector('[data-act="register-form"]');
  if (registerForm) registerForm.addEventListener('submit', (e) => { e.preventDefault(); const f = new FormData(registerForm); completeRegister(f.get('username'), f.get('password')); });

  root.querySelectorAll('[data-act="edit-tx"]').forEach(el =>
    el.addEventListener('click', () => setState({ editingId: Number(el.dataset.id), appTab: 'form', showAddCategory:false, showAddCard:false })));

  root.querySelectorAll('[data-act="delete-tx"]').forEach(el =>
    el.addEventListener('click', () => deleteTransaction(Number(el.dataset.id))));

  const cancelEdit = root.querySelector('[data-act="cancel-edit"]');
  if (cancelEdit) cancelEdit.addEventListener('click', () => setState({ editingId: null }));

  const typeToggle = root.querySelector('[data-role="type-toggle"]');
  if (typeToggle) typeToggle.querySelectorAll('button').forEach(btn =>
    btn.addEventListener('click', () => {
      root.querySelector('[data-role="type-input"]').value = btn.dataset.type;
      typeToggle.querySelectorAll('button').forEach(b => b.classList.remove('on','income','expense'));
      btn.classList.add('on', btn.dataset.type);
    }));

  const toggleAddCategory = root.querySelector('[data-act="toggle-add-category"]');
  if (toggleAddCategory) toggleAddCategory.addEventListener('click', () => setState({ showAddCategory: !state.showAddCategory }));

  const toggleAddCard = root.querySelector('[data-act="toggle-add-card"]');
  if (toggleAddCard) toggleAddCard.addEventListener('click', () => setState({ showAddCard: !state.showAddCard }));

  const addCategoryBtn = root.querySelector('[data-act="add-category"]');
  if (addCategoryBtn) addCategoryBtn.addEventListener('click', async () => {
    const input = root.querySelector('[data-role="new-category-title"]');
    const title = input.value.trim();
    if (!title) return;
    try { await createCategory(title); setState({ showAddCategory: false }); }
    catch (e) { setState({ error: e.message }); }
  });

  const addCardBtn = root.querySelector('[data-act="add-card"]');
  if (addCardBtn) addCardBtn.addEventListener('click', async () => {
    const bank = root.querySelector('[data-role="new-card-bank"]').value.trim();
    const num = root.querySelector('[data-role="new-card-number"]').value.trim();
    if (!bank || !num) return;
    try { await createCard(bank, num); setState({ showAddCard: false }); }
    catch (e) { setState({ error: e.message }); }
  });

  const txForm = root.querySelector('[data-act="tx-form"]');
  if (txForm) txForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = new FormData(txForm);
    const dateStr = jalaliToGregStr(Number(f.get('date_y')), Number(f.get('date_m')), Number(f.get('date_d')));
    const payload = {
      title: f.get('title'),
      description: f.get('description') || '',
      type: f.get('type'),
      amount: Number(f.get('amount')),
      date: dateStr,
      category: f.get('category') ? Number(f.get('category')) : null,
      card: f.get('card') ? Number(f.get('card')) : null,
    };
    saveTransaction(payload, state.editingId);
  });

  const periodSelect = root.querySelector('[data-role="period-select"]');
  if (periodSelect) periodSelect.addEventListener('change', () => setState({ reportPeriod: periodSelect.value, report: null, reportError: '' }));

  const reportForm = root.querySelector('[data-act="report-form"]');
  if (reportForm) reportForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = new FormData(reportForm);
    const params = { period: f.get('period') };
    if (state.reportPeriod === 'custom') {
      params.start_date = `${f.get('start_y')}-${pad2(f.get('start_m'))}-${pad2(f.get('start_d'))}`;
      params.end_date = `${f.get('end_y')}-${pad2(f.get('end_m'))}-${pad2(f.get('end_d'))}`;
    } else {
      for (const key of ['year','month','day','week_number']) {
        const v = f.get(key);
        if (v) params[key] = v;
      }
    }
    runReport(params);
  });
}

/* ---------------- global safety net ---------------- */
/* Surfaces unexpected JS errors in the UI + console instead of failing silently
   (which can look like "nothing happened" or the app reverting to its default screen). */
window.addEventListener('error', (e) => {
  console.error('Unhandled error:', e.error || e.message);
  if (state.view === 'auth') setState({ error: 'خطای غیرمنتظره: ' + (e.message || 'جزئیات در کنسول مرورگر') });
});
window.addEventListener('unhandledrejection', (e) => {
  console.error('Unhandled promise rejection:', e.reason);
  if (state.view === 'auth') setState({ error: 'خطای غیرمنتظره: ' + (e.reason && e.reason.message ? e.reason.message : 'جزئیات در کنسول مرورگر') });
});

/* ---------------- init ---------------- */
render();
if (state.view === 'app') bootstrapApp();
</script>
</body>
</html>
